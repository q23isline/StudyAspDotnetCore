# <https://learn.microsoft.com/ja-jp/aspnet/core/host-and-deploy/linux-nginx?view=aspnetcore-8.0&tabs=linux-ubuntu>
server {
    listen 80;
    server_name study-asp-dotnet-core.com;

    root /var/www/html;
    index index.html;

    access_log /var/log/nginx/nginx-access.log;
    error_log  /var/log/nginx/nginx-error.log;

    # NGINX のバージョンを返さない
    server_tokens off;

    # クリックジャッキング対策（ページをフレーム内に表示させない）
    # <https://developer.mozilla.org/ja/docs/Web/HTTP/Headers/X-Frame-Options>
    add_header X-Frame-Options DENY always;
    # XSS 対策
    # <https://developer.mozilla.org/ja/docs/Web/HTTP/Headers/Content-Security-Policy>
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
    # MIME タイプのスニッフィングを抑止
    # <https://developer.mozilla.org/ja/docs/Web/HTTP/Headers/X-Content-Type-Options>
    add_header X-Content-Type-Options nosniff always;
    # リファラーを送信しない（本サイトから外部サイトへアクセスしたという情報は渡さない）
    # <https://developer.mozilla.org/ja/docs/Web/HTTP/Headers/Referrer-Policy>
    add_header Referrer-Policy no-referrer always;
    # ブラウザの機能の利用を制限（位置情報、マイク、カメラは許可しない）
    # <https://developer.mozilla.org/ja/docs/Web/HTTP/Headers/Permissions-Policy>
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # TODO: HTTPS の設定をする

    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://backend-prod:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection keep-alive;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
